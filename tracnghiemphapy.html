<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh đẹp zai</title>
    <style>
        :root { --p-color: #2563eb; --s-color: #22c55e; --e-color: #ef4444; --bg: #f8fafc; --txt: #1e293b; --card: #ffffff; }
        body.dark-mode { --bg: #0f172a; --txt: #f1f5f9; --card: #1e293b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); display: flex; justify-content: center; padding: 20px; transition: 0.3s; margin: 0; min-height: 100vh; box-sizing: border-box; }
        .container { background: var(--card); width: 100%; max-width: 800px; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); height: fit-content; }
        h1, h2 { text-align: center; margin-top: 0; }
        .btn { padding: 0.8rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 14px; }
        .btn-main { background: var(--p-color); color: white; width: 100%; margin-bottom: 10px; }
        .btn-outline { background: transparent; border: 2px solid var(--p-color); color: var(--p-color); width: 100%; }
        .btn-outline:hover { background: var(--p-color); color: white; }
        .theme-toggle { display: block; margin: 0 auto 20px; background: transparent; border: 1px solid var(--p-color); color: var(--p-color); border-radius: 20px; padding: 5px 15px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: var(--p-color); width: 0%; transition: 0.3s; }
        .option { padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .option:hover { border-color: var(--p-color); background: rgba(37, 99, 235, 0.05); }
        .correct { background: #dcfce7 !important; border-color: var(--s-color) !important; color: #166534 !important; }
        .wrong { background: #fee2e2 !important; border-color: var(--e-color) !important; color: #991b1b !important; }
        .disabled { pointer-events: none; }
        #quiz-controls { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <h1>Minh đẹp zai</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Chế độ Bảo vệ mắt</button>
        <button class="btn btn-main" style="background: #dc2626;" onclick="startRandomExam()">🔥 ĐỀ THI NGẪU NHIÊN (XXX CÂU)</button>
        <button class="btn btn-main" style="background: #059669;" onclick="startQuiz('All')">📚 LÀM TẤT CẢ CÂU HỎI</button>
        <div class="grid" id="category-list"></div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar" id="p-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="q-info" style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 5px;"></div>
        <h2 id="q-text" style="text-align: left; font-size: 1.2rem;"></h2>
        <div id="options-container"></div>
        <div id="quiz-controls">
            <button class="btn hidden" id="btn-redo" style="background: #f59e0b; color: white;" onclick="redoWrongNow()">🔄 Làm lại câu sai ngay</button>
            <button class="btn" style="background: #64748b; color: white; margin-left: auto;" onclick="toMenu()">🏠 Về Menu</button>
        </div>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
        <h2>Kết Quả Hoàn Thành</h2>
        <p id="score-text" style="font-size: 2rem; font-weight: bold;"></p>
        <button class="btn btn-main" onclick="toMenu()">Quay lại Menu</button>
    </div>
</div>

<script>

    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Năm 1989, Bộ Y tế ra quyết định thành lập tổ chức nào?", a: ["Viện Y học Tư pháp Trung ương", "Tổ Pháp y", "Tổ chức Giám định Pháp y Trung ương", "Bộ môn Pháp y"], correct: "Tổ chức Giám định Pháp y Trung ương"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Viện Y học Tư pháp Trung ương được thành lập vào thời điểm nào?", a: ["Năm 1989", "Năm 1983", "Năm 1977", "Ngày 17/01/2001"], correct: "Ngày 17/01/2001"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Năm 1977, sự kiện nào đánh dấu bước phát triển của pháp y tại Đại học Y khoa Hà Nội?", a: ["Tổ Pháp y được hình thành trong Bộ môn Giải phẫu bệnh", "Bắt đầu giảng dạy môn pháp y", "Thành lập Viện Pháp y", "Thành lập Viện Y học Tư pháp Trung ương"], correct: "Tổ Pháp y được hình thành trong Bộ môn Giải phẫu bệnh"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Nhà hóa học người Anh nào được xem là người đầu tiên áp dụng khoa học vào giám định pháp y (lĩnh vực độc chất học)?", a: ["Henry Goddard", "James Marsh", "Paul Uhlenhuth", "Alphonse Bertillon"], correct: "James Marsh"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Trong vụ án John Bodle (1832), nghi phạm bị cáo buộc đầu độc ông mình bằng cách nào?", a: ["Tiêm thạch tín", "Rượu pha xyanua", "Cà phê có chứa thạch tín (asen)", "Thức ăn nhiễm thủy ngân"], correct: "Cà phê có chứa thạch tín (asen)"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Trong “Marsh test” cải tiến, mẫu nghi ngờ chứa asen được xử lý để tạo ra sản phẩm đặc trưng nào?", a: ["Tinh thể trắng", "Dung dịch xanh lam", "Kết tủa vàng asen trisulfide", "Khí arsine, khi đốt tạo cặn asen đen bạc trên bề mặt lạnh"], correct: "Khí arsine, khi đốt tạo cặn asen đen bạc trên bề mặt lạnh"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Marsh lần đầu công bố phương pháp xét nghiệm asen của mình (1836) trên tạp chí nào?", a: ["The Edinburgh Philosophical Journal", "The Lancet", "Nature", "The British Medical Journal"], correct: "The Edinburgh Philosophical Journal"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Henry Goddard (Scotland Yard, 1835) được xem là người tiên phong trong lĩnh vực nào của pháp y?", a: ["Xét nghiệm độc chất", "So sánh đạn – nền tảng giám định vũ khí (ballistics)", "Nhân trắc học", "Phân tích ADN"], correct: "So sánh đạn – nền tảng giám định vũ khí (ballistics)"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Alphonse Bertillon, sĩ quan cảnh sát người Pháp, là người đầu tiên áp dụng kỹ thuật nào vào thực thi pháp luật?", a: ["So sánh đạn", "Lấy dấu vân tay", "Nhân trắc học (đo các đặc điểm vật lý của cơ thể)", "Phân tích ADN"], correct: "Nhân trắc học (đo các đặc điểm vật lý của cơ thể)"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Hệ thống nhân trắc học của Bertillon về sau chủ yếu bị thay thế bởi phương pháp nào?", a: ["Xét nghiệm huyết thanh", "Phân tích ADN", "So sánh đạn", "Phương pháp lấy dấu vân tay"], correct: "Phương pháp lấy dấu vân tay"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Juan Vucetich (Argentina) đã có đóng góp nào vào năm 1892 trong lĩnh vực vân tay học?", a: ["Thành lập văn phòng vân tay đầu tiên trên thế giới", "Phát hiện VNTRs", "Phát minh máy quét vân tay", "Công bố bảng phân loại ADN"], correct: "Thành lập văn phòng vân tay đầu tiên trên thế giới"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Vụ án Francisca Rojas ở Necochea (Argentina) có ý nghĩa lịch sử vì:", a: ["Lần đầu áp dụng Marsh test", "Lần đầu dấu vân tay được sử dụng thành công trong một cuộc điều tra hình sự", "Lần đầu dùng nhân trắc học để định tội", "Lần đầu dùng ADN để nhận dạng"], correct: "Lần đầu dấu vân tay được sử dụng thành công trong một cuộc điều tra hình sự"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Xét nghiệm Uhlenhuth (1901) – phản ứng kết tủa kháng nguyên–kháng thể – được dùng để làm gì?", a: ["Xác định thời gian tử vong", "Định nhóm máu ABO", "Phân biệt máu người với máu động vật", "Phát hiện asen trong máu"], correct: "Phân biệt máu người với máu động vật"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Phân tích ADN pháp y (DNA fingerprinting) được phát triển năm 1984 bởi Sir Alec Jeffreys, dựa trên cơ sở nào?", a: ["Nồng độ protein huyết tương", "Nhóm máu Rh", "Số lượng nhiễm sắc thể", "Các đoạn ADN lặp lại ngẫu nhiên (VNTRs) khác nhau giữa từng người"], correct: "Các đoạn ADN lặp lại ngẫu nhiên (VNTRs) khác nhau giữa từng người"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Frances Glessner Lee (1878–1962) được vinh danh với danh hiệu nào và nổi tiếng với công trình nào?", a: ["“Mẹ của khoa học pháp y”, với các mô hình hiện trường thu nhỏ “The Nutshell Studies of Unexplained Death”", "Người sáng lập văn phòng vân tay đầu tiên", "Người phát minh Marsh test", "“Cha đẻ pháp y phương Đông”, với cuốn Tẩy oan tập lục"], correct: "“Mẹ của khoa học pháp y”, với các mô hình hiện trường thu nhỏ “The Nutshell Studies of Unexplained Death”"},
    {cat: "Bài 1: Giới thiệu môn Pháp y", q: "Theo tài liệu, các chuyên gia pháp y được dự báo sẽ đảm nhận vai trò ngày càng quan trọng trong cơ quan tư pháp quốc tế nào?", a: ["Tổ chức Cảnh sát Hình sự Quốc tế (Interpol)", "Tòa án Hình sự Quốc tế (International Criminal Court)", "Tổ chức Y tế Thế giới (WHO)", "Hội đồng Bảo an Liên Hợp Quốc"], correct: "Tòa án Hình sự Quốc tế (International Criminal Court)"},

    // --- BÀI 2: ĐỘC CHẤT HỌC PHÁP Y ---
    {cat: "Bài 2: Độc chất học Pháp y", q: "Cơ chế gây độc chính của oxyd carbon (CO) là:", a: ["Ức chế men cholinesterase, gây tích tụ acetylcholine", "Kết hợp với hemoglobin tạo HbCO, ái lực cao hơn O₂ từ 200-300 lần", "Gây tan huyết trực tiếp hồng cầu", "Ức chế tổng hợp heme trong tủy xương"], correct: "Kết hợp với hemoglobin tạo HbCO, ái lực cao hơn O₂ từ 200-300 lần"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Nồng độ HbCO/máu đạt bao nhiêu thì nạn nhân tử vong rất nhanh chóng?", a: ["25%", "45%", "60%", "70%"], correct: "70%"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Màu sắc đặc trưng của hoen tử thi trong ngộ độc CO là:", a: ["Tím bầm", "Nâu sẫm", "Đỏ hồng cánh sen", "Vàng nhạt"], correct: "Đỏ hồng cánh sen"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Nguyên lý điều trị ngộ độc CO cấp của Nicloux (1903) dựa trên:", a: ["Dùng BAL để giải phóng CO khỏi hemoglobin", "Truyền máu toàn phần tươi", "Cho thở oxy áp lực cao, phản ứng HbCO + O₂ → HbO₂ + CO diễn ra theo chiều ngược", "Dùng glucose ưu trương tĩnh mạch"], correct: "Cho thở oxy áp lực cao, phản ứng HbCO + O₂ → HbO₂ + CO diễn ra theo chiều ngược"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Khi thở oxy 100% ở nhiệt độ phòng, thời gian bán hủy của CO trong cơ thể là:", a: ["3-4 giờ", "30-90 phút", "15-23 phút", "5-10 phút"], correct: "30-90 phút"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Tại sao cơ tim đặc biệt nhạy cảm với CO hơn so với hồng cầu?", a: ["Cơ tim có nhiều thụ thể CO hơn", "CO kết hợp với myoglobin của cơ tim với ái lực cao hơn hồng cầu", "Cơ tim không có khả năng dự trữ oxy", "CO ức chế trực tiếp kênh canxi tim"], correct: "CO kết hợp với myoglobin của cơ tim với ái lực cao hơn hồng cầu"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Hiện tượng 'nguyên dạng của tử thi' trong ngộ độc CO gặp ở hoàn cảnh nào?", a: ["Ngộ độc CO mạn tính kéo dài", "Nổ túi khí trong khai thác mỏ than, CO nồng độ rất cao làm cơ co cứng lập tức", "Nạn nhân chết trong đám cháy lớn", "Ngộ độc CO do đốt than sưởi trong phòng kín"], correct: "Nổ túi khí trong khai thác mỏ than, CO nồng độ rất cao làm cơ co cứng lập tức"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Phương pháp định tính CO tại chỗ theo Gradwohl sử dụng:", a: ["Dung dịch NaOH 5% - máu có CO chuyển màu xanh", "Đốt nóng ống nghiệm 55°C trong 5 phút - máu bình thường ngã nâu đen", "Thuốc thử acid tanic + acid pyroganic - máu có HbCO còn màu hồng", "Sắc ký khí định lượng trực tiếp"], correct: "Dung dịch NaOH 5% - máu có CO chuyển màu xanh"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Cơ chế gây tử vong của HCN ở nồng độ cao là:", a: ["Gây tan huyết hàng loạt", "Gây ngạt tế bào trong khi oxy còn ứ đọng nhiều trong máu", "Ức chế men cholinesterase", "Gây co thắt phế quản cấp"], correct: "Gây ngạt tế bào trong khi oxy còn ứ đọng nhiều trong máu"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Đặc điểm đại thể khi mổ tử thi ngộ độc HCN là:", a: ["Gan vàng nhạt, mùi dầu hỏa", "Mùi hạt đào bốc lên khi mổ ổ bụng, tạng màu đỏ tươi cánh sen", "Phổi tím bầm, xung huyết nặng", "Thận hoại tử trắng, niêm mạc dạ dày đen"], correct: "Mùi hạt đào bốc lên khi mổ ổ bụng, tạng màu đỏ tươi cánh sen"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "HCN có mặt tự nhiên trong thực phẩm nào thường gây ngộ độc ở Việt Nam?", a: ["Mật ong và nấm rừng", "Vỏ sắn và một số hạt đào, hạt mơ", "Tôm cua biển và hến sò", "Đồ hộp phồng"], correct: "Vỏ sắn và một số hạt đào, hạt mơ"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Điểm khác biệt quan trọng giữa ngộ độc CO và HCN về sinh lý bệnh là:", a: ["CO gây tăng methemoglobin, HCN gây tăng HbCO", "CO làm máu không vận chuyển được O₂ (HbCO); HCN gây ngạt tế bào nhưng O₂ vẫn còn nhiều trong máu", "HCN gây tán huyết, CO không gây tán huyết", "Hai chất có cùng cơ chế tác động"], correct: "CO làm máu không vận chuyển được O₂ (HbCO); HCN gây ngạt tế bào nhưng O₂ vẫn còn nhiều trong máu"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Lý do CO₂ thường tích tụ gây nguy hiểm ở đáy giếng lâu không thau là:", a: ["CO₂ nặng hơn không khí (tỷ trọng 1,254) nên lắng xuống thấp", "CO₂ kết hợp với nước ngầm tạo acid carbonic độc", "Vi khuẩn kỵ khí sản sinh CO₂ liên tục", "CO₂ trong đất thấm vào do áp suất cao"], correct: "CO₂ nặng hơn không khí (tỷ trọng 1,254) nên lắng xuống thấp"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Khi nồng độ oxy giảm xuống 8% và CO₂ tăng đến 12% trong không gian kín, biểu hiện lâm sàng sẽ là:", a: ["Nhức đầu nhẹ, chóng mặt", "Khó thở, tim đập nhanh", "Hôn mê, co giật, rối loạn tim mạch và hô hấp dẫn đến tử vong", "Buồn nôn, nôn, tiêu chảy"], correct: "Hôn mê, co giật, rối loạn tim mạch và hô hấp dẫn đến tử vong"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Dấu hiệu đặc trưng khi khám tử thi ngộ độc CO₂ đơn thuần (không có CO kèm theo) là:", a: ["Da, niêm mạc đỏ hồng cánh sen", "Hoen tử thi đỏ tươi, máu không đông", "Mặt tím bầm, chấm xuất huyết nhỏ, hoen tử thi phát triển sớm, tạng ứ máu", "Hoại tử niêm mạc dạ dày màu tím đen"], correct: "Mặt tím bầm, chấm xuất huyết nhỏ, hoen tử thi phát triển sớm, tạng ứ máu"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Liều gây chết của arsenic trioxide (As₂O₃) thường là:", a: ["1-4 mg", "4 grain (khoảng 260 mg)", "1-4 gram", "10-20 gram"], correct: "4 grain (khoảng 260 mg)"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Arsenic lắng đọng chủ yếu trong tổ chức nào trong ngộ độc mạn tính?", a: ["Tủy xương và lách", "Não và tủy sống", "Tóc, móng tay và các tổ chức sừng hóa", "Cơ tim và cơ xương"], correct: "Tóc, móng tay và các tổ chức sừng hóa"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Vạch trắng trên móng tay (Mees lines) trong ngộ độc arsenic là:", a: ["Vạch đỏ do xuất huyết dưới móng", "Nơi arsenic lắng đọng trong quá trình phát triển móng", "Vạch đen do sulfide arsenic", "Vạch nâu do oxy hóa arsenic"], correct: "Nơi arsenic lắng đọng trong quá trình phát triển móng"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Hình ảnh đại thể đặc trưng của niêm mạc dạ dày trong ngộ độc arsenic cấp là:", a: ["Hoại tử trắng do ăn mòn", "Niêm mạc màu nhung đỏ (velvet red) và chảy máu vùng vách tâm thất", "Xuất huyết dạng chấm nốt lan tỏa", "Loét sâu hình đáy chén"], correct: "Niêm mạc màu nhung đỏ (velvet red) và chảy máu vùng vách tâm thất"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Dạng khí arsine (AsH₃) gây độc chủ yếu qua cơ chế nào?", a: ["Gây hoại tử thần kinh trung ương", "Gây tan huyết và tổn thương gan, thận", "Ức chế men cytochrome oxidase", "Gây viêm phổi hóa học"], correct: "Gây tan huyết và tổn thương gan, thận"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Khi khai quật tử thi điều tra ngộ độc arsenic, mẫu đất bắt buộc phải lấy là:", a: ["Chỉ lấy đất trong quan tài", "Đất phía trên, dưới quan tài và đất xung quanh quan tài để so sánh", "Đất cách xa mộ ít nhất 10 mét", "Không cần lấy đất"], correct: "Đất phía trên, dưới quan tài và đất xung quanh quan tài để so sánh"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Dấu hiệu đặc trưng của ngộ độc chì mạn tính trên niêm mạc miệng là:", a: ["Loét hoại tử màu trắng", "Đường màu hơi xanh đen của chì sulfide trên vùng lợi (Burton's line)", "Mảng đỏ xuất huyết lan tỏa", "Niêm mạc teo mỏng, nhợt nhạt"], correct: "Đường màu hơi xanh đen của chì sulfide trên vùng lợi (Burton's line)"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Trên X-quang xương dài ở trẻ em ngộ độc chì mạn tính, dấu hiệu đặc trưng là:", a: ["Loãng xương lan tỏa", "Gãy bệnh lý tự phát", "Vạch chì đậm đặc (lead lines) ở đầu xương", "Hình ảnh tiêu xương vỏ"], correct: "Vạch chì đậm đặc (lead lines) ở đầu xương"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Ngưỡng nồng độ chì máu cần điều trị chelate ở trẻ dưới 5 tuổi là:", a: ["Trên 10 μg/100ml", "Trên 25 μg/100ml", "Trên 45 μg/100ml", "Trên 80 μg/100ml"], correct: "Trên 45 μg/100ml"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Ngộ độc chì tetraethyl (dùng trong dầu mỏ) có biểu hiện đặc trưng là:", a: ["Đau bụng cấp và tiêu chảy ra máu", "Liệt vận động kiểu ngoại biên", "Triệu chứng giống bệnh tâm thần hơn là tổn thương tạng nội tạng", "Suy thận cấp tiến triển nhanh"], correct: "Triệu chứng giống bệnh tâm thần hơn là tổn thương tạng nội tạng"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Liều chết của mercuric chloride (HgCl₂) là:", a: ["10-50 mg", "180 mg đến 1-4 gram", "10-20 gram", "Trên 50 gram"], correct: "180 mg đến 1-4 gram"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Tổn thương giải phẫu bệnh đặc trưng nhất của ngộ độc thủy ngân tại thận là:", a: ["Viêm cầu thận tăng sinh lan tỏa", "Hoại tử ống thận, có xu hướng lắng đọng calci trong ống thận", "Xơ hóa gian thận lan tỏa", "Viêm thận bể thận mạn"], correct: "Hoại tử ống thận, có xu hướng lắng đọng calci trong ống thận"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Nguyên nhân tử vong thường gặp trong ngộ độc thủy ngân cấp tính là:", a: ["Suy gan tối cấp", "Rung tâm thất và/hoặc suy thận (thường sau 10-12 ngày)", "Phù brain cấp", "Suy hô hấp do viêm phổi hóa học"], correct: "Rung tâm thất và/hoặc suy thận (thường sau 10-12 ngày)"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Cơ chế gây độc của thuốc trừ sâu phosphate hữu cơ (parathion) là:", a: ["Ức chế cytochrome oxidase", "Ức chế men anticholinesterase, gây tích tụ acetylcholine", "Gây tan huyết trực tiếp", "Phong bế thụ thể beta-adrenergic"], correct: "Ức chế men anticholinesterase, gây tích tụ acetylcholine"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Đặc điểm nổi bật của hóa chất DDT và dieldrin (organochlorine) trong môi trường là:", a: ["Tan mạnh trong nước, thải trừ nhanh qua thận", "Bền vững trong môi trường, tích lũy trong mô mỡ của người và động vật", "Bị phân hủy nhanh bởi nhiệt và ánh sáng", "Chỉ độc với côn trùng, không độc với người"], correct: "Bền vững trong môi trường, tích lũy trong mô mỡ của người và động vật"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Triệu chứng đặc trưng của ngộ độc Botulinum toxin (Clostridium botulinum) KHÁC với ngộ độc thực phẩm thông thường là:", a: ["Tiêu chảy ra máu nặng và suy thận", "Ngoài triệu chứng tiêu hóa còn có: hoa mắt, nhìn đôi, khó thở, tim đập chậm", "Sốt cao và nhiễm trùng huyết", "Co giật và hôn mê sâu"], correct: "Ngoài triệu chứng tiêu hóa còn có: hoa mắt, nhìn đôi, khó thở, tim đập chậm"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Nồng độ rượu máu đạt bao nhiêu thì hôn mê xuất hiện?", a: ["60 mg/100ml", "150 mg/100ml", "300 mg/100ml (> 3‰)", "500 mg/100ml"], correct: "300 mg/100ml (> 3‰)"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Rượu methanol gây độc đặc biệt với cơ quan nào dưới đây?", a: ["Thận và gan", "Tim và phổi", "Võng mạc và thần kinh thị giác", "Tủy thượng thận"], correct: "Võng mạc và thần kinh thị giác"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Cơ thể Mallory (Mallory bodies) trong tế bào gan là dấu hiệu của:", a: ["Xơ gan do viêm gan B mạn", "Viêm gan do rượu (alcoholic hepatitis)", "Ung thư biểu mô tế bào gan", "Gan nhiễm mỡ không do rượu (NAFLD)"], correct: "Viêm gan do rượu (alcoholic hepatitis)"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Hội chứng Wernicke trong nghiện rượu mạn tính đặc trưng bởi tổn thương giải phẫu bệnh tại:", a: ["Vỏ脑 thùy trán", "Tiểu脑 - thủy giun", "Vùng dưới đồi và thành brain thất 3-4, hoại tử nhỏ và chảy máu", "Hạch nền"], correct: "Vùng dưới đồi và thành brain thất 3-4, hoại tử nhỏ và chảy máu"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Lượng máu tối thiểu cần lấy để xét nghiệm độc chất theo quy định thu mẫu pháp y là:", a: ["10 ml", "50 ml", "100 ml", "200 ml"], correct: "100 ml"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Khi nghi ngờ ngộ độc phenol, mẫu bệnh phẩm ưu tiên lấy là:", a: ["Não và tủy sống", "Máu và nước tiểu, chú ý chất nôn và chất dạ dày đã được rửa", "Gan và lách", "Dịch brain tủy"], correct: "Máu và nước tiểu, chú ý chất nôn và chất dạ dày đã được rửa"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Để xác định nạn nhân còn sống khi đám cháy hình thành, dấu hiệu nào sau đây có giá trị nhất?", a: ["Tư thế 'võ sĩ' của tử thi", "Vết cháy bỏng độ 3 lan rộng", "Bụi than dưới dây thanh âm và trong phế quản nhỏ; chất chứa dạ dày có bụi than", "Nấm bọt xuất hiện ở mũi miệng"], correct: "Bụi than dưới dây thanh âm và trong phế quản nhỏ; chất chứa dạ dày có bụi than"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Chảy máu do nhiệt cao (heat haematoma) ở ngoài màng cứng trong nạn nhân chết cháy có ý nghĩa pháp y gì?", a: ["Luôn chứng tỏ nạn nhân bị đánh vào đầu trước khi chết", "Có thể xét nghiệm định lượng CO trong máu vùng này; dương tính chứng tỏ tổn thương hình thành sau chết", "Xác định nạn nhân chết trước khi đám cháy hình thành", "Không có giá trị pháp y"], correct: "Có thể xét nghiệm định lượng CO trong máu vùng này; dương tính chứng tỏ tổn thương hình thành sau chết"},
    {cat: "Bài 2: Độc chất học Pháp y", q: "Trong số các yếu tố sau, yếu tố nào KHÔNG ảnh hưởng đến mức độ nhiễm độc của một chất?", a: ["Đường vào cơ thể và nồng độ chất độc", "Tuổi, giới và cơ địa bệnh nhân", "Màu sắc và mùi của chất độc", "Bệnh mạn tính kèm theo (tim mạch, phổi)"], correct: "Màu sắc và mùi của chất độc"},

    // --- BÀI 3: PHÁP Y TỬ VONG VÀ BIẾN ĐỔI TỬ THI ---
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Tử vong là gì?", a: ["Sự mất tri giác tạm thời", "Sự ngừng thở có hồi phục", "Sự chấm dứt không hồi phục mọi hoạt động sống", "Sự hôn mê sâu"], correct: "Sự chấm dứt không hồi phục mọi hoạt động sống"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Chết lâm sàng là trạng thái:", a: ["Hoại tử cơ quan", "Có thể phục hồi", "Có phân hủy mô", "Mất hoàn toàn ý thức"], correct: "Có thể phục hồi"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nguyên nhân tử vong là:", a: ["Sự thay đổi khí hậu", "Các bệnh lý, chấn thương hoặc hoàn cảnh gây chết", "Sự kết thúc cuộc sống", "Mất phản xạ giác mạc"], correct: "Các bệnh lý, chấn thương hoặc hoàn cảnh gây chết"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nguyên nhân tử vong trực tiếp là:", a: ["Bệnh lý khởi phát", "Tai nạn trước đó", "Nguyên nhân gần nhất dẫn đến tử vong", "Tác nhân môi trường"], correct: "Nguyên nhân gần nhất dẫn đến tử vong"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nguyên nhân tử vong trung gian là:", a: ["Nguyên nhân chính khởi phát", "Biến chứng giữa nguyên nhân chính và trực tiếp", "Sự ngừng tim", "Tình trạng mất tri giác"], correct: "Biến chứng giữa nguyên nhân chính và trực tiếp"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Khi chỉ có 1 nguyên nhân gây tử vong, đó là:", a: ["Nguyên nhân gián tiếp", "Nguyên nhân môi trường", "Nguyên nhân chính", "Nguyên nhân thứ phát"], correct: "Nguyên nhân chính"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Sự khác biệt giữa hình thái tử vong và nguyên nhân tử vong là:", a: ["Không có sự khác biệt", "Hình thái là nguyên nhân sâu xa", "Hình thái là biểu hiện như ngừng tim", "Nguyên nhân là triệu chứng"], correct: "Hình thái là biểu hiện như ngừng tim"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Trình tự chuỗi bệnh lý tử vong bắt đầu từ:", a: ["Nguyên nhân chính", "Nguyên nhân thứ phát", "Nguyên nhân trực tiếp", "Hình thái tử vong"], correct: "Nguyên nhân trực tiếp"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Chẩn đoán tử vong nên tránh ghi:", a: ["Sốc nhiễm khuẩn", "Ngừng tim", "Xuất huyết não", "Suy đa cơ quan"], correct: "Ngừng tim"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Chuỗi bệnh lý dẫn đến tử vong có thể không có:", a: ["Nguyên nhân chính", "Nguyên nhân trung gian", "Nguyên nhân trực tiếp", "Hình thái tử vong"], correct: "Nguyên nhân trung gian"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Mất tri giác là biểu hiện của:", a: ["Chết lâm sàng", "Ngừng hô hấp", "Ngừng tuần hoàn", "Hệ thần kinh ngừng hoạt động"], correct: "Hệ thần kinh ngừng hoạt động"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Đồng tử không phản xạ với ánh sáng chứng tỏ:", a: ["Hệ hô hấp ngừng", "Hệ thần kinh còn hoạt động", "Ngừng hoạt động thần kinh", "Vẫn còn ý thức"], correct: "Ngừng hoạt động thần kinh"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Không có rì rào phế nang khi nghe phổi chứng tỏ:", a: ["Viêm phổi nặng", "Đang thở máy", "Không có hô hấp", "Hôn mê"], correct: "Không có hô hấp"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Không có mạch đập và tiếng tim là biểu hiện:", a: ["Ngừng hô hấp", "Rối loạn chuyển hóa", "Ngừng tuần hoàn", "Suy tim nhẹ"], correct: "Ngừng tuần hoàn"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nghiệm pháp éther xác định:", a: ["Sự sống ở thần kinh", "Sự lưu thông máu", "Hệ hô hấp còn hoạt động", "Có tổn thương gan"], correct: "Sự lưu thông máu"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nghiệm pháp Icard là để:", a: ["Kiểm tra phản xạ thần kinh", "Xác định chết não", "Kiểm tra hệ tuần hoàn", "Ghi điện tim"], correct: "Kiểm tra hệ tuần hoàn"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Dấu hiệu dương tính trong nghiệm pháp ngừng thở nghĩa là:", a: ["Bệnh nhân hồi phục", "Vẫn còn thở được", "Không có khả năng tự thở", "Phổi còn giãn nở"], correct: "Không có khả năng tự thở"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Chết brain là:", a: ["Mất hoàn toàn tri giác nhưng còn thở", "Tình trạng có thể hồi phục", "Mất không hồi phục chức năng não", "Mất tuần hoàn"], correct: "Mất không hồi phục chức năng não"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Đồng tử giãn trên bao nhiêu mm là tiêu chuẩn chết não?", a: ["2 mm", "3 mm", "4 mm", "5 mm"], correct: "4 mm"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Phản xạ mắt búp bê bị mất trong:", a: ["Mất ngủ sâu", "Sốc chấn thương", "Chết não", "Đột quỵ nhẹ"], correct: "Chết脑"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Chụp cắt lớp vi tính xuyên sọ trong chết não sẽ:", a: ["Thấy tắc động mạch não", "Không thấy mạch máu não ngấm thuốc", "Có tụ máu dưới màng cứng", "Phù não nhẹ"], correct: "Không thấy mạch máu não ngấm thuốc"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Phản xạ mắt – tiền đình dương tính khi:", a: ["Không có chuyển động mắt", "Mắt quay về phía bơm nước lạnh", "Mắt quay ngược bên đối diện", "Mắt đứng yên khi có kích thích"], correct: "Mắt quay về phía bơm nước lạnh"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Để xác định chết não phải có ít nhất:", a: ["6 giờ theo dõi", "1 bác sĩ chuyên môn", "2 lần đánh giá trong ngày", "12 giờ kể từ lúc đủ tiêu chuẩn lâm sàng"], correct: "12 giờ kể từ lúc đủ tiêu chuẩn lâm sàng"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Trường hợp nào không đánh giá chết não?", a: ["Bệnh nhân đang dùng thuốc an thần", "Người bị chấn thương sọ não", "Bệnh nhân sốt cao", "Người lớn tuổi bị hôn mê"], correct: "Bệnh nhân đang dùng thuốc an thần"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Mục đích của xác định chết não là:", a: ["Phân loại nguyên nhân tử vong", "Chẩn đoán điều trị nội khoa", "Xác định ngừng tuần hoàn", "Hỗ trợ quyết định hiến mô, tạng"], correct: "Hỗ trợ quyết định hiến mô, tạng"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nguội lạnh tử thi dùng để:", a: ["Ước tính nhiệt độ môi trường", "Xác định nguyên nhân chết", "Ước lượng thời gian chết (PMI)", "Kiểm tra độ ẩm tử thi"], correct: "Ước lượng thời gian chết (PMI)"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Phép đo PMI dựa vào:", a: ["Thời gian bệnh lý", "Công thức nhiệt độ cơ thể và giảm nhiệt", "Nồng độ điện giải máu", "Xét nghiệm enzyme gan"], correct: "Công thức nhiệt độ cơ thể và giảm nhiệt"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Nhiệt độ môi trường ảnh hưởng đến:", a: ["Chết não", "Phân loại tử vong", "Tốc độ mất nhiệt tử thi", "Nhịp tim"], correct: "Tốc độ mất nhiệt tử thi"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Co cứng tử thi là do:", a: ["Giảm oxy não", "Tăng lactate", "Mất ATP và tăng ion canxi", "Mất nước cơ thể"], correct: "Mất ATP và tăng ion canxi"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Cứng tử thi hình thành hoàn toàn sau bao lâu?", a: ["6 giờ", "12 giờ", "18 giờ", "24 giờ"], correct: "12 giờ"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Da ngỗng sau chết là do:", a: ["Phù nề dưới da", "Co cứng cơ dựng lông", "Thiếu oxy mô", "Hoại tử mạch máu"], correct: "Co cứng cơ dựng lông"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Phá cứng tử thi trong 4–6 giờ đầu sẽ:", a: ["Không ảnh hưởng", "Cứng trở lại mạnh hơn", "Cứng lại nhẹ hơn", "Làm tăng độ co rút cơ"], correct: "Cứng lại nhẹ hơn"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Hoen tử thi là kết quả của:", a: ["Thiếu oxy máu", "Ngưng tim", "Máu dồn vùng thấp do trọng lực", "Rối loạn đông máu"], correct: "Máu dồn vùng thấp do trọng lực"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Thời kỳ lắng đọng máu của hoen tử thi xuất hiện:", a: ["1–2 giờ sau chết", "6–12 giờ sau chết", "Ngay lập tức", "Sau 24 giờ"], correct: "1–2 giờ sau chết"},
    {cat: "Bài 3: Tử vong & Biến đổi tử thi", q: "Thời kỳ thẩm thấu của hoen tử thi là sau:", a: ["8 giờ", "12 giờ", "18 giờ", "24 giờ"], correct: "18 giờ"},
