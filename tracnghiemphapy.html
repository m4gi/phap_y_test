    {cat: "Bài 4: Pháp y Ngạt", q: "Dấu hiệu cho thấy có vật cản đường thở:", a: ["Dạ dày trương to", "Phổi teo", "Dị vật tại thanh quản", "Mắt tụ máu"], correct: "Dị vật tại thanh quản"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Ngạt nước là một dạng:", a: ["Sốc nhiễm trùng", "Asphyxia", "Nhiễm độc", "Phản xạ hít nước"], correct: "Asphyxia"},
    {cat: "Bài 4: Pháp y Ngạt", q: "“Dry drowning” là:", a: ["Chết đuối có nhiều nước phổi", "Chết do hít hơi nước nóng", "Chết do co thắt thanh môn, ít nước trong phổi", "Chết đuối trong nước mặn"], correct: "Chết do co thắt thanh môn, ít nước trong phổi"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Dấu hiệu “foam cone” (bọt hồng) xuất hiện ở:", a: ["Ngạt hóa chất", "Ngạt nước", "Ngạt cơ học", "Tắc nghẽn đường thở"], correct: "Ngạt nước"},
    {cat: "Bài 4: Pháp y Ngạt", q: "“Paltauf’s spots” là:", a: ["Xuất huyết màng phổi nhỏ giọt", "Đám phù phổi", "Chấm máu dưới kết mạc", "Hoen tử thi màu tím"], correct: "Xuất huyết màng phổi nhỏ giọt"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Trong nước ngọt, cơ chế tử vong có liên quan tới:", a: ["Phù phổi do dịch thẩm thấu", "Tan hồng cầu và tăng kali máu", "Giảm natri máu do tăng thải", "Tăng canxi máu đột ngột"], correct: "Tan hồng cầu và tăng kali máu"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Dấu hiệu nào giúp xác định nạn nhân còn sống khi xuống nước?", a: ["Không có hoen tử thi", "Có bọt hồng ở mũi, miệng", "Máu đông cứng", "Dạ dày trống"], correct: "Có bọt hồng ở mũi, miệng"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Dạ dày chứa đầy nước gợi ý:", a: ["Ngạt do đè ép", "Ngạt do treo cổ", "Ngạt do hít nước khi còn sống", "Ngạt do hóa chất"], correct: "Ngạt do hít nước khi còn sống"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Nguyên nhân dẫn đến tử vong nhanh hơn:", a: ["Ngạt nước mặn", "Ngạt nước ngọt", "Cả hai như nhau", "Tùy vào tuổi nạn nhân"], correct: "Ngạt nước ngọt"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Phổi trong ngạt nước có đặc điểm:", a: ["Nhỏ gọn, xẹp", "Phồng lớn, màu đỏ tím", "Xơ hóa phổi", "Màu trắng"], correct: "Phồng lớn, màu đỏ tím"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Ngạt do chấn thương thường liên quan đến:", a: ["Hít khí độc", "Bị đè ngực/bụng", "Đuối nước", "Co thắt cơ hô hấp"], correct: "Bị đè ngực/bụng"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Dấu hiệu đặc trưng ở mặt trong ngạt cơ học là:", a: ["Xanh nhạt", "Tím, phù, xuất huyết kết mạc", "Mất phản xạ ánh sáng", "Bạch cầu tăng cao"], correct: "Tím, phù, xuất huyết kết mạc"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Crowd crush thường gây tử vong do:", a: ["Suy thận cấp", "Thiếu máu brain", "Ngạt do chèn ép", "Đột quỵ"], correct: "Ngạt do chèn ép"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Cơ chế chính trong ngạt do chấn thương:", a: ["Suy thận", "Tắc nghẽn đường hô hấp do đè ép", "Hạ huyết áp", "Rối loạn đông máu"], correct: "Tắc nghẽn đường hô hấp do đè ép"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Trong ngạt do tư thế, tư thế dễ gây tử vong là:", a: ["Nằm ngửa tay dang rộng", "Nằm sấp mặt úp xuống gối", "Đứng thẳng", "Ngồi trên ghế"], correct: "Nằm sấp mặt úp xuống gối"},
    {cat: "Bài 4: Pháp y Ngạt", q: "CO là khí:", a: ["Có mùi ngọt", "Không mùi, không màu", "Có vị chua", "Màu vàng nhạt"], correct: "Không mùi, không màu"},
    {cat: "Bài 4: Pháp y Ngạt", q: "CO có ái lực với Hb cao gấp:", a: ["100 lần", "200 lần", "300 lần", "500 lần"], correct: "300 lần"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Đặc điểm màu da/niêm trong ngộ độc CO:", a: ["Tím tái", "Vàng sẫm", "Đỏ tươi", "Trắng bệch"], correct: "Đỏ tươi"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Phản ứng phát hiện HbCO bằng formalin tạo màu:", a: ["Vàng", "Đỏ tươi", "Xanh lá", "Đen"], correct: "Đỏ tươi"},
    {cat: "Bài 4: Pháp y Ngạt", q: "HCN gây chết vì:", a: ["Tắc mạch", "Tổn thương gan", "Ức chế hô hấp tế bào", "Viêm não"], correct: "Ức chế hô hấp tế bào"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Dấu hiệu mùi hạnh nhân là gợi ý của:", a: ["CO", "Methanol", "HCN", "H₂S"], correct: "HCN"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Hoen tử thi màu “cánh sen” gợi ý:", a: ["Treo cổ", "Ngạt nước", "Ngạt do HCN", "Dị vật đường thở"], correct: "Ngạt do HCN"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Cứng tử thi sớm là đặc điểm của:", a: ["Treo cổ", "Ngạt do hóa chất", "Hạ thân nhiệt", "Nhiễm trùng huyết"], correct: "Ngạt do hóa chất"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Màu sắc phủ tạng trong ngộ độc CO:", a: ["Xanh", "Đen", "Đỏ tươi", "Trắng bệch"], correct: "Đỏ tươi"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Cơ chế chết của HCN là:", a: ["Tan máu", "Vỡ phế nang", "Ngăn cản sử dụng O₂ của tế bào", "Co thắt khí quản"], correct: "Ngăn cản sử dụng O₂ của tế bào"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Ngạt trong tự thủ dâm thường là:", a: ["Ngạt nước", "Treo cổ không hoàn toàn", "Ngạt hóa chất", "Chẹn cổ bằng tay"], correct: "Treo cổ không hoàn toàn"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Vết cào xước quanh cổ xuất hiện khi:", a: ["Án mạng siết cổ", "Treo cổ tai nạn", "Tự treo cổ kháng cự", "Cả ba đáp án trên"], correct: "Cả ba đáp án trên"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Ngạt do tư thế thường xảy ra khi:", a: ["Nạn nhân trói tay, nằm sấp", "Bị đâm ngực", "Rơi từ độ cao", "Đứt mạch máu lớn"], correct: "Nạn nhân trói tay, nằm sấp"},
    {cat: "Bài 4: Pháp y Ngạt", q: "“Diagnosis of exclusion” áp dụng cho:", a: ["Ngạt hóa chất", "Ngạt tư thế", "Ngạt nước", "Ngạt chấn thương"], correct: "Ngạt nước"},
    {cat: "Bài 4: Pháp y Ngạt", q: "Trong ngạt kết hợp chấn thương, điều cần xác định là:", a: ["Tuổi nạn nhân", "Thời gian chết", "Nguyên nhân chính gây tử vong", "Mức độ tổn thương gan"], correct: "Nguyên nhân chính gây tử vong"},

    // --- BÀI 5: TAI NẠN GIAO THÔNG ĐƯỜNG BỘ ---
    {cat: "Bài 5: Tai nạn giao thông", q: "Theo Tổ chức Y tế Thế giới (WHO), số người tử vong do tai nạn giao thông đường bộ trên toàn thế giới mỗi năm là khoảng:", a: ["600.000 người", "1,2 triệu người", "2,4 triệu người", "3,0 triệu người"], correct: "1,2 triệu người"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tại Việt Nam năm 2020, số người tử vong do tai nạn giao thông là:", a: ["4.500 người", "5.600 người", "6.700 người", "8.200 người"], correct: "6.700 người"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Ước tính bao nhiêu phần trăm các vụ tai nạn giao thông là do lỗi của người lái xe?", a: ["75%", "85%", "90%", "95%"], correct: "95%"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Người được ghi nhận là nạn nhân tử vong do tai nạn ô tô đầu tiên trên thế giới là:", a: ["Mary Shelley", "Mary Curie", "Mary Ward", "Mary Queen"], correct: "Mary Ward"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nạn nhân tử vong ô tô đầu tiên trên thế giới xảy ra vào năm nào?", a: ["1856", "1869", "1885", "1901"], correct: "1869"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Lực lượng cảnh sát hiện nay ưu tiên sử dụng thuật ngữ nào thay cho 'tai nạn' giao thông?", a: ["Sự cố", "Va chạm", "Tình huống khẩn cấp", "Biến cố"], correct: "Va chạm"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tác hại do va chạm giao thông đường bộ so với các phương thức giao thông khác (hàng không, đường biển, đường sắt) là:", a: ["Tương đương", "Thấp hơn", "Lớn hơn tất cả cộng lại", "Chỉ lớn hơn đường sắt"], correct: "Lớn hơn tất cả cộng lại"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Theo phân loại thời gian tử vong sau chấn thương, 'tử vong sớm' được định nghĩa là tử vong trong:", a: ["Vài phút sau chấn thương", "Vài giờ sau chấn thương", "24 giờ đầu", "72 giờ đầu"], correct: "Vài giờ sau chấn thương"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nguyên nhân chủ yếu gây tử vong NGAY LẬP TỨC tại hiện trường tai nạn giao thông bao gồm tất cả NGOẠI TRỪ:", a: ["Vỡ tim", "Đứt hoàn toàn tủy cổ từ C3 trở lên", "Suy đa cơ quan", "Vết rách lớn động mạch chủ"], correct: "Suy đa cơ quan"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tử vong muộn sau tai nạn giao thông (nhiều ngày sau) thường do tất cả các nguyên nhân sau, NGOẠI TRỪ:", a: ["Suy đa cơ quan", "Hội chứng suy hô hấp cấp (ARDS)", "Thuyên tắc phổi", "Vỡ tim"], correct: "Vỡ tim"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương cấp một (primary injury) ở người đi bộ bị xe ô tô đâm là do:", a: ["Người đi bộ bị văng lên nắp ca-pô, kính chắn gió", "Va chạm trực tiếp đầu tiên của xe với người đi bộ", "Người đi bộ bị văng xuống đất sau khi xe giảm tốc", "Người đi bộ bị cuốn vào gầm xe"], correct: "Va chạm trực tiếp đầu tiên của xe với người đi bộ"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Vị trí chấn thương cấp một phổ biến nhất ở người đi bộ bị xe ô tô đâm là:", a: ["Đầu", "Ngực", "Chân (xương chày, xương mác)", "Xương chậu"], correct: "Chân (xương chày, xương mác)"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương cấp hai (secondary injury) ở người đi bộ xảy ra khi:", a: ["Va chạm đầu tiên của xe với người đi bộ", "Người đi bộ bị văng lên nắp ca-pô, kính chắn gió, trụ cửa", "Người đi bộ bị văng xuống đất", "Người đi bộ bị xe cán qua"], correct: "Người đi bộ bị văng lên nắp ca-pô, kính chắn gió, trụ cửa"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nguyên nhân tử vong phổ biến nhất trong chấn thương cấp hai ở người đi bộ là:", a: ["Gãy xương sườn gây tràn khí màng phổi", "Vỡ hộp sọ và tổn thương brain", "Vỡ gan hoặc lách", "Gãy cột sống cổ"], correct: "Vỡ hộp sọ và tổn thương brain"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương cấp ba (tertiary injury) ở người đi bộ xảy ra khi:", a: ["Va chạm đầu tiên với cản xe", "Người bị văng lên nắp ca-pô", "Xe giảm tốc nhanh hơn người đi bộ, khiến người bị văng xuống đất", "Người bị xe cán qua"], correct: "Xe giảm tốc nhanh hơn người đi bộ, khiến người bị văng xuống đất"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Vết trầy xước ở chấn thương cấp ba người đi bộ có ý nghĩa pháp y quan trọng vì:", a: ["Xác định loại xe gây tai nạn", "Chỉ ra hướng di chuyển của nạn nhân trên mặt đường", "Xác định tốc độ xe lúc va chạm", "Phân biệt tai nạn với án mạng"], correct: "Chỉ ra hướng di chuyển của nạn nhân trên mặt đường"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Khi xe buýt hoặc xe tải đâm người đi bộ, điểm chấn thương cấp một thường:", a: ["Thấp hơn so với ô tô thông thường", "Tương đương với ô tô thông thường", "Cao hơn, có thể ở xương chậu, bụng, cánh tay hoặc đầu", "Tập trung chủ yếu ở xương chày"], correct: "Cao hơn, có thể ở xương chậu, bụng, cánh tay hoặc đầu"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tỷ lệ người điều khiển xe máy tử vong do tai nạn giao thông so với người điều khiển ô tô là:", a: ["Tương đương", "Thấp hơn", "Cao hơn nhiều", "Chỉ cao hơn ở nạn nhân không đội mũ bảo hiểm"], correct: "Cao hơn nhiều"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương đầu ở người điều khiển xe máy chiếm khoảng bao nhiêu phần trăm trong số các ca tử vong?", a: ["40%", "60%", "80%", "95%"], correct: "80%"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Dạng chấn thương đặc trưng khi người điều khiển xe mô tô lao vào phía sau xe tải và đầu va vào đuôi xe là:", a: ["Gãy xương hàm mặt", "Chấn thương cột sống cổ", "Có thể bị chặt đầu (decapitation)", "Vỡ hộp sọ trán"], correct: "Có thể bị chặt đầu (decapitation)"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Luật bắt buộc thắt dây an toàn phía trước và phía sau được ước tính giảm bao nhiêu phần trăm số người chết và thương tật nghiêm trọng?", a: ["10%", "15%", "25%", "40%"], correct: "25%"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Thương tích do dây an toàn gây ra bao gồm tất cả, NGOẠI TRỪ:", a: ["Bầm tím và gãy xương đòn", "Gãy xương ức hoặc xương sườn", "Vỡ mạc treo ruột, ruột", "Gãy xương chậu do tác động trực tiếp từ cản xe"], correct: "Gãy xương chậu do tác động trực tiếp từ cản xe"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Cơ chế bỏng do túi khí bao gồm:", a: ["Chỉ bỏng nhiệt do khí nóng", "Chỉ bỏng hóa chất do kiềm (natri hydroxit)", "Cả bỏng nhiệt và bỏng hóa chất (natri hydroxit)", "Bỏng do hóa chất axit"], correct: "Cả bỏng nhiệt và bỏng hóa chất (natri hydroxit)"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương mắt do túi khí gây ra bao gồm tất cả, NGOẠI TRỪ:", a: ["Trầy xước giác mạc", "Lệch thủy tinh thể", "Xuất huyết dịch kính", "Đục thủy tinh thể"], correct: "Đục thủy tinh thể"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tại Việt Nam, số lượng xe máy lưu hành năm 2016 là:", a: ["Hơn 25 triệu chiếc", "Hơn 35 triệu chiếc", "Hơn 45 triệu chiếc", "Hơn 55 triệu chiếc"], correct: "Hơn 45 triệu chiếc"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Khi phanh gấp trước khi ô tô va chạm với người đi bộ, điểm tiếp xúc với người đi bộ sẽ:", a: ["Cao hơn bình thường do đầu xe ngóc lên", "Thấp hơn bình thường do đầu xe chúi xuống", "Không thay đổi", "Phụ thuộc vào trọng lượng xe"], correct: "Thấp hơn bình thường do đầu xe chúi xuống"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Bỏng diện tích bề mặt cơ thể nào do hỏa hoạn trong tai nạn giao thông gây tử vong ngay lập tức?", a: ["≥ 50%", "≥ 70%", "≥ 80%", "≥ 90%"], correct: "≥ 90%"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nghiên cứu gần đây cho thấy mô hình tử vong do chấn thương hiện nay so với mô hình 'ba đỉnh' cổ điển là:", a: ["Vẫn theo mô hình ba đỉnh rõ ràng", "Đỉnh đầu tiên biến mất, chỉ còn đỉnh thứ hai và thứ ba", "Đỉnh đầu tiên rất lớn, đỉnh thứ hai ('sớm') giảm đáng kể", "Ba đỉnh hợp nhất thành một đỉnh duy nhất"], correct: "Đỉnh đầu tiên rất lớn, đỉnh thứ hai ('sớm') giảm đáng kể"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tác động chính của rượu lên khả năng lái xe bao gồm tất cả, NGOẠI TRỪ:", a: ["Tăng chấp nhận rủi ro", "Suy giảm khả năng tập trung", "Tăng thời gian phản ứng", "Cải thiện khả năng phối hợp vận động"], correct: "Cải thiện khả năng phối hợp vận động"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nghị định 100/2019/NĐ-CP của Việt Nam quy định về:", a: ["Tiêu chuẩn kỹ thuật phương tiện giao thông", "Xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt", "Quy trình giám định pháp y tai nạn giao thông", "Đào tạo và cấp bằng lái xe"], correct: "Xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Trong giám định hiện trường tai nạn giao thông, bước đầu tiên cần thực hiện là:", a: ["Chụp ảnh toàn bộ hiện trường", "Đảm bảo bảo mật hiện trường để ngăn mất bằng chứng", "Kiểm tra tình trạng cơ học của xe", "Thu thập lời khai nhân chứng"], correct: "Đảm bảo bảo mật hiện trường để ngăn mất bằng chứng"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Trong giám định phương tiện tham gia tai nạn giao thông, yêu cầu chính nào sau đây là ĐÚNG?", a: ["Chỉ cần xác định tốc độ xe trước va chạm", "Thiết lập tình trạng cơ học sơ bộ và đánh giá yếu tố phương tiện có góp phần gây tai nạn", "Chỉ cần kiểm tra tình trạng phanh", "Chỉ cần kiểm tra hệ thống đèn chiếu sáng"], correct: "Thiết lập tình trạng cơ học sơ bộ và đánh giá yếu tố phương tiện có góp phần gây tai nạn"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Phương pháp tính tốc độ ô tô dựa trên độ dài vết trượt được ứng dụng đến thập niên nào thì không còn được chấp nhận trước tòa?", a: ["Thập niên 1950", "Thập niên 1960", "Giữa thập niên 1970", "Thập niên 1980"], correct: "Giữa thập niên 1970"},
    {cat: "Bài 5: Tai nạn giao thông", q: "'Lý thuyết rủi ro bù trừ' trong an toàn giao thông có nội dung là:", a: ["Phương tiện an toàn hơn sẽ luôn làm giảm tai nạn", "Khi phương tiện an toàn hơn, người lái xe bù đắp bằng cách chấp nhận nhiều rủi ro hơn", "Hệ thống đường bộ an toàn hơn làm tăng tốc độ lưu thông", "Người lái xe kinh nghiệm ít gặp tai nạn hơn"], correct: "Khi phương tiện an toàn hơn, người lái xe bù đắp bằng cách chấp nhận nhiều rủi ro hơn"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Theo mã đường cao tốc, ô tô di chuyển với tốc độ 64 km/h cần bao nhiêu mét để dừng lại?", a: ["20 mét", "25 mét", "36 mét", "50 mét"], correct: "36 mét"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Chấn thương KHÔNG phổ biến ở người đi xe đạp bị tai nạn là:", a: ["Chấn thương đầu", "Chấn thương vai và cánh tay khi ngã xuống đất", "Tổn thương ban đầu ở đùi, hông hoặc ngực do xe va chạm", "Gãy xương chày hai bên do xe cán qua"], correct: "Gãy xương chày hai bên do xe cán qua"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Dây an toàn có thể hoạt động như 'vòng cổ' gây nguy hiểm khi nào?", a: ["Người ngồi quá cao so với dây nịt", "Người ngồi quá nhỏ/thấp so với dây nịt, bị trượt xuống bên dưới khi va chạm", "Dây an toàn bị khóa cứng", "Túi khí không bung ra"], correct: "Người ngồi quá nhỏ/thấp so với dây nịt, bị trượt xuống bên dưới khi va chạm"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Các thiết bị gắn trên xe có thể lưu trữ dữ liệu hữu ích cho điều tra tai nạn giao thông bao gồm tất cả, NGOẠI TRỪ:", a: ["Hệ thống quản lý động cơ (ECU)", "Hệ thống định vị vệ tinh (GPS)", "Hệ thống chống bó cứng phanh (ABS)", "Hệ thống điều hòa không khí"], correct: "Hệ thống điều hòa không khí"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Nồng độ cồn trung bình trong máu của người lái xe bị buộc tội lái xe say rượu tại Anh vào thập niên 1950 là:", a: ["80 mg/100mL", "150 mg/100mL", "180 mg/100mL", "220 mg/100mL"], correct: "220 mg/100mL"},
    {cat: "Bài 5: Tai nạn giao thông", q: "Tụ máu ngoài màng cứng (extradural hematoma) trong tai nạn giao thông thuộc nhóm tử vong nào theo phân loại thời gian?", a: ["Tử vong ngay lập tức (vài phút đầu)", "Tử vong sớm (vài giờ sau), nguyên tắc có thể điều trị được", "Tử vong muộn (nhiều ngày sau)", "Không thuộc nhóm nào"], correct: "Tử vong sớm (vài giờ sau), nguyên tắc có thể điều trị được"},

    // --- BÀI 6: ĐẠI CƯƠNG VỀ TỔN THƯƠNG ---
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương trong pháp y được định nghĩa là gì?", a: ["Chỉ tổn thương do bệnh lý", "Do tác nhân nội tại gây ra", "Bao gồm mọi tổn thương do tác nhân bên ngoài và phản ứng của cơ thể", "Chỉ tổn thương phần mềm"], correct: "Bao gồm mọi tổn thương do tác nhân bên ngoài và phản ứng của cơ thể"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Mục đích của việc ghi nhận thương tích một cách hệ thống là:", a: ["Phục vụ điều trị bệnh", "Đảm bảo đầy đủ chứng cứ pháp lý", "Để làm đẹp hồ sơ bệnh án", "Thống kê hành chính"], correct: "Đảm bảo đầy đủ chứng cứ pháp lý"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Khi mô tả vị trí vết thương, nên dùng cách nào?", a: ["Ghi theo cảm quan", "Dùng tên dân gian", "Sử dụng thuật ngữ giải phẫu và khoảng cách từ mốc cơ thể", "Dùng ký hiệu riêng"], correct: "Sử dụng thuật ngữ giải phẫu và khoảng cách từ mốc cơ thể"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Một yếu tố thuộc phản ứng toàn thân là:", a: ["Đỏ da", "Bầm tím", "Sốc mất máu", "Mưng mủ"], correct: "Sốc mất máu"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Phản ứng tại chỗ bao gồm biểu hiện nào sau đây?", a: ["Co giật", "Tăng huyết áp", "Bầm tím, sưng, nóng, đỏ, đau", "Ngất xỉu"], correct: "Bầm tím, sưng, nóng, đỏ, đau"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Phản ứng cấp độ tế bào có vai trò gì?", a: ["Xác định tình trạng bệnh mãn tính", "Giúp xác định nguyên nhân tổn thương", "Tạo sẹo nhanh chóng", "Ngăn mất máu"], correct: "Giúp xác định nguyên nhân tổn thương"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Sự tạo sẹo/mô xơ có thể gây:", a: ["Liền thương và phục hồi chức năng", "Gây tắc mạch", "Ngưng tim", "Gây ra loãng xương"], correct: "Liền thương và phục hồi chức năng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Phản ứng ở mức độ siêu cấu trúc dùng để:", a: ["Chụp cộng hưởng từ", "Mô tả cảm xúc", "Phân tích tổn thương vi thể", "Điều trị chống viêm"], correct: "Phân tích tổn thương vi thể"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Yếu tố nào sau đây KHÔNG phải là yếu tố hoàn cảnh ảnh hưởng phản ứng cơ thể?", a: ["Thời tiết", "Tuổi", "Điều kiện kinh tế xã hội", "Mức độ nhiễm trùng"], correct: "Mức độ nhiễm trùng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Một ví dụ về phản ứng sinh hóa học là:", a: ["Phát ban", "Tăng men viêm", "Rạn xương", "Trật khớp"], correct: "Tăng men viêm"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết trầy xước da thường gây ra do:", a: ["Lực ép vuông góc", "Vật nhọn đâm xuyên", "Lực tác động tiếp tuyến của vật cùn", "Do áp lực âm"], correct: "Lực tác động tiếp tuyến của vật cùn"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Sau bao lâu thì xuất hiện tế bào viêm trong vết trầy xước ở người sống?", a: ["1-2 giờ", "4-8 giờ", "12-24 giờ", "Sau 48 giờ"], correct: "4-8 giờ"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết trầy xước sau khi chết có đặc điểm gì?", a: ["Màu đỏ sẫm", "Màu vàng, không có phản ứng viêm", "Có dịch mủ", "Đau nhức"], correct: "Màu vàng, không có phản ứng viêm"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết bầm tím là kết quả của:", a: ["Vỡ mao mạch và máu thoát ra mô xung quanh", "Chảy máu nội tạng", "Gãy xương", "Bỏng da"], correct: "Vỡ mao mạch và máu thoát ra mô xung quanh"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Dấu vết đầu ngón tay để lại trên da là dạng:", a: ["Bỏng", "Trầy xước", "Vết bầm hoa văn", "Nốt phát ban"], correct: "Vết bầm hoa văn"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Một vết bầm có hình hoa văn chồng lên vết cũ có thể gợi ý:", a: ["Một tai nạn", "Suy giảm đông máu", "Nhiều lần chấn thương ở thời điểm khác nhau", "Dị ứng da"], correct: "Nhiều lần chấn thương ở thời điểm khác nhau"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tụ máu là tổn thương do:", a: ["Suy mạch", "Chấn thương gây vỡ mạch cỡ vừa", "Nhiễm trùng mô mềm", "Tăng huyết áp"], correct: "Chấn thương gây vỡ mạch cỡ vừa"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tụ máu nội sọ có thể gây hậu quả gì?", a: ["Lành tính", "Không ảnh hưởng", "Tử vong nhanh chóng", "Dị ứng"], correct: "Tử vong nhanh chóng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết rách da là do:", a: ["Lực kéo của cơ", "Chấn thương vật sắc", "Lực nghiền/cắt từ vật cùn", "Vật nhọn đâm"], correct: "Lực nghiền/cắt từ vật cùn"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Đặc điểm của vết rách da là:", a: ["Mép gọn, không bầm", "Không có cầu mô bên trong", "Mép không đều, có thể có lông xuyên qua", "Khó phân biệt với bỏng"], correct: "Mép không đều, có thể có lông xuyên qua"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết đâm thường do:", a: ["Vật tròn", "Vật cùn", "Vật nhọn như dao, kéo", "Áp lực âm"], correct: "Vật nhọn như dao, kéo"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết đâm ở ngực có thể gây ra:", a: ["Viêm màng phổi", "Tràn khí màng phổi căng", "Loét phổi", "Ho kéo dài"], correct: "Tràn khí màng phổi căng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết chém nghiêm trọng thường có đặc điểm:", a: ["Cạn, nhỏ", "Nông, tròn", "Sâu, mép rộng, đáy hẹp", "Nhỏ và nông"], correct: "Sâu, mép rộng, đáy hẹp"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết dập nát là:", a: ["Vết trầy nhẹ", "Gây vỡ xương toàn bộ", "Gây tổn thương mô mềm, thần kinh, mạch máu phức tạp", "Vết bỏng khô"], correct: "Gây tổn thương mô mềm, thần kinh, mạch máu phức tạp"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương phần mềm phổ biến nhất trong đánh nhau là:", a: ["Tụ máu", "Trầy xước móng tay", "Phỏng", "Bỏng acid"], correct: "Trầy xước móng tay"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Một vết thương cũ có tổ chức đóng vảy có đặc điểm:", a: ["Màu đỏ tươi", "Có chảy máu", "Màu nâu sẫm, có tổ chức sẹo", "Rất đau"], correct: "Màu nâu sẫm, có tổ chức sẹo"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết sẹo trắng xiên là dấu hiệu:", a: ["Viêm da", "Ung thư", "Tổn thương đã lành, để lại sẹo", "Loét hoại tử"], correct: "Tổn thương đã lành, để lại sẹo"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Đặc điểm nào sau đây KHÔNG có trong vết rách da?", a: ["Mép đều", "Mép rách không đều", "Có mô cầu nối", "Bầm tím quanh mép"], correct: "Mép đều"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Mô mềm không đều trong vết rách gợi ý:", a: ["Vết cắt", "Do vật nóng", "Do lực nghiền", "Do áp lực âm"], correct: "Do lực nghiền"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tại sao cần kiểm tra thần kinh/mạch máu khi có vết đâm sâu?", a: ["Để xác định độ bẩn", "Để xác định chức năng cơ quan bị ảnh hưởng", "Vì pháp luật yêu cầu", "Để băng bó đúng cách"], correct: "Để xác định chức năng cơ quan bị ảnh hưởng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương nông bề mặt xương thường gặp trong:", a: ["Loãng xương", "Chấn thương phần mềm", "Vết bập nông không thấy trên Xquang", "Ung thư xương"], correct: "Vết bập nông không thấy trên Xquang"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương bề mặt xương đặc biệt được xác định nhờ:", a: ["Chụp Xquang", "Nội soi khớp", "Quan sát trực tiếp khi phẫu tích", "MRI"], correct: "Quan sát trực tiếp khi phẫu tích"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Rạn xương là:", a: ["Gãy hoàn toàn", "Nứt xương, chưa gãy rời", "Vỡ nhiều mảnh", "Mất đoạn xương"], correct: "Nứt xương, chưa gãy rời"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Rạn hình sao thường gặp trong chấn thương:", a: ["Lực kéo cơ", "Tác động nhẹ", "Tác động mạnh, tâm chấn rõ rệt", "Vật nhọn"], correct: "Tác động mạnh, tâm chấn rõ rệt"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Rạn xương do 2 thời điểm khác nhau có thể:", a: ["Không phát hiện được", "Không có giá trị pháp y", "Có ý nghĩa trong xác định số lần bị thương", "Là dấu hiệu tự nhiên"], correct: "Có ý nghĩa trong xác định số lần bị thương"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết lún xương sọ là:", a: ["Phình lên", "Tổn thương mô mềm", "Xương lõm xuống, có thể đè vào màng cứng", "Gãy hoàn toàn"], correct: "Xương lõm xuống, có thể đè vào màng cứng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Lún bản ngoài xương sọ nhưng bản trong còn nguyên:", a: ["Không nguy hiểm", "Có thể để lại dấu hình dạng vật tác động", "Gây xuất huyết脑", "Không thấy trên phim"], correct: "Có thể để lại dấu hình dạng vật tác động"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Thủng xương thường do:", a: ["Loãng xương", "Vật cùn", "Đạn bắn hoặc vật nhọn", "Bệnh lý xương"], correct: "Đạn bắn hoặc vật nhọn"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Gãy trực tiếp là:", a: ["Gãy tại vị trí xa tác động", "Gãy do tác động nội sinh", "Gãy ngay tại nơi va đập", "Gãy do bệnh lý"], correct: "Gãy ngay tại nơi va đập"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Gãy gián tiếp là:", a: ["Gãy khi đang ngủ", "Gãy do bệnh lý", "Tác động ở một nơi, gãy ở nơi khác", "Gãy do viêm"], correct: "Tác động ở một nơi, gãy ở nơi khác"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Gãy kiểu chêm có đặc điểm:", a: ["Xương gãy thẳng", "Gãy thành 2 mảnh", "Gãy kèm mảnh vát giống hình chêm", "Gãy vụn"], correct: "Gãy kèm mảnh vát giống hình chêm"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vỡ xương thường gặp nhất ở:", a: ["Xương nhỏ", "Cột sống", "Xương sọ, xương hàm, xương chậu", "Chi trên"], correct: "Xương sọ, xương hàm, xương chậu"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trật khớp cần lưu ý khi:", a: ["Gây mất máu", "Có bệnh nền", "Có gãy xương kèm theo", "Không đau"], correct: "Có gãy xương kèm theo"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trật khớp mạn tính là:", a: ["Trật khớp xảy ra nhiều lần hoặc kéo dài", "Mới bị", "Không cần điều trị", "Do viêm"], correct: "Trật khớp xảy ra nhiều lần hoặc kéo dài"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trật khớp thường gây ảnh hưởng đến:", a: ["Da", "Tủy sống", "Cơ, dây chằng và mạch máu xung quanh", "Mắt"], correct: "Cơ, dây chằng và mạch máu xung quanh"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương phối hợp là:", a: ["Tổn thương riêng biệt", "Một vết thương nhỏ", "Tổn thương nhiều cơ quan hoặc nhiều vùng cơ thể", "Gãy xương nhỏ"], correct: "Tổn thương nhiều cơ quan hoặc nhiều vùng cơ thể"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Loại tổn thương này thường gặp trong:", a: ["Dị ứng", "Lao động nhẹ", "Tai nạn giao thông, tai nạn lao động", "Bỏng"], correct: "Tai nạn giao thông, tai nạn lao động"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Thương tích vùng Răng - Hàm - Mặt là ví dụ của:", a: ["Chấn thương nhẹ", "Phân loại theo cơ chế", "Phân loại theo chuyên khoa", "Không thuộc phạm vi pháp y"], correct: "Phân loại theo chuyên khoa"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trật khớp kèm theo rách da được gọi là:", a: ["Trật khớp hở", "Gãy kín", "Trật khớp bệnh lý", "Không phân loại"], correct: "Trật khớp hở"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Gãy xương trong tai nạn giao thông thường là:", a: ["Gãy tự phát", "Gãy đơn giản", "Gãy phức tạp, vỡ nhiều mảnh", "Gãy do viêm"], correct: "Gãy phức tạp, vỡ nhiều mảnh"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Thương tích do điện là do:", a: ["Nhiệt độ cao", "Tác động từ sóng siêu âm", "Dòng điện gây tổn thương mô cơ thể", "Chấn thương cơ học"], correct: "Dòng điện gây tổn thương mô cơ thể"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng nhiệt là do:", a: ["Ánh sáng xanh", "Tia X", "Nhiệt độ cao gây tổn thương da", "Dị ứng thực phẩm"], correct: "Nhiệt độ cao gây tổn thương da"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng lạnh xảy ra khi tiếp xúc với nhiệt độ:", a: ["Trên 50°C", "Dưới 10°C", "Khoảng 30°C", "0°C đến 40°C"], correct: "Dưới 10°C"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng độ 1 ảnh hưởng đến:", a: ["Cơ xương", "Mô dưới da", "Lớp thượng bì", "Mạch máu sâu"], correct: "Lớp thượng bì"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng độ 3 đặc trưng bởi:", a: ["Đỏ nhẹ, đau", "Bong da", "Tổn thương sâu tới mô dưới da, không đau do hoại tử thần kinh", "Tổn thương chỉ ở lớp nông"], correct: "Tổn thương sâu tới mô dưới da, không đau do hoại tử thần kinh"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trong đánh giá bỏng cần quan tâm đến:", a: ["Cân nặng", "Tốc độ phục hồi", "Tỷ lệ % diện tích cơ thể bị bỏng", "Thời gian ngủ"], correct: "Tỷ lệ % diện tích cơ thể bị bỏng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng hóa chất thường gây:", a: ["Tổn thương nhẹ", "Tổn thương sâu và lâu lành", "Tổn thương thoáng qua", "Tăng sắc tố"], correct: "Tổn thương sâu và lâu lành"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trong pháp y, loại hóa chất nào thường được đề cập nhất khi nói đến thương tích?", a: ["Clorua", "Axit và kiềm", "Ethanol", "Vitamin"], correct: "Axit và kiềm"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Bỏng do kiềm thường:", a: ["Nông hơn acid", "Tổn thương ít hơn", "Xâm nhập sâu hơn acid", "Không nguy hiểm"], correct: "Xâm nhập sâu hơn acid"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Dấu hiệu quan trọng khi nhận diện bỏng acid là:", a: ["Vết bỏng mờ", "Có mùi hắc, tổn thương nông", "Tổn thương sâu, không lan rộng", "Mủ chảy ra"], correct: "Tổn thương sâu, không lan rộng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tác nhân hóa học có thể gây ung thư sau bỏng lâu ngày là:", a: ["Nước muối", "Hydro peroxide", "Bỏng kiềm/acide kéo dài gây biến đổi mô", "Dung dịch muối sinh lý"], correct: "Bỏng kiềm/acide kéo dài gây biến đổi mô"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương bỏng độ 5 thường:", a: ["Rất nhẹ", "Tổn thương lớp cơ và xương, đe dọa tính mạng", "Không nguy hiểm", "Gây ngứa"], correct: "Tổn thương lớp cơ và xương, đe dọa tính mạng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Phản ứng hóa sinh trong tổn thương nhằm:", a: ["Chống viêm", "Tăng đường huyết", "Xác định cơ chế và chất gây thương tích", "Gây đau"], correct: "Xác định cơ chế và chất gây thương tích"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Tổn thương do điện thường để lại:", a: ["Vết thâm", "Vết cháy đen hình tròn hoặc vết vào-ra dòng điện", "Trầy xước", "Mắt đỏ"], correct: "Vết cháy đen hình tròn hoặc vết vào-ra dòng điện"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Thương tích do điện dễ gây:", a: ["Rối loạn tiêu hóa", "Co giật và ngừng tim", "Suy gan", "Loãng xương"], correct: "Co giật và ngừng tim"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trong thương tích do điện, dòng điện càng mạnh thì:", a: ["Tổn thương càng nhẹ", "Tỷ lệ sống càng cao", "Tổn thương nội tạng càng nghiêm trọng", "Không ảnh hưởng"], correct: "Tổn thương nội tạng càng nghiêm trọng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Axit có thể gây tổn thương đặc trưng ở:", a: ["Biểu bì da", "Mô dưới da", "Cả mô và nội tạng tiếp xúc", "Không gây tổn thương"], correct: "Cả mô và nội tạng tiếp xúc"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Vết bỏng hóa chất có thể để lại:", a: ["Da sáng màu", "Tăng mọc lông", "Sẹo xấu và loét sâu", "Không ảnh hưởng lâu dài"], correct: "Sẹo xấu và loét sâu"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Trong pháp y, thương tích do hóa chất có thể:", a: ["Không được xem xét", "Chỉ ghi nhận nếu đau", "Là chứng cứ pháp lý rất quan trọng", "Không ảnh hưởng đến điều tra"], correct: "Là chứng cứ pháp lý rất quan trọng"},
    {cat: "Bài 6: Đại cương về thương tích", q: "Loại thương tích nào sau đây KHÔNG thuộc nhóm lý – hóa?", a: ["Tổn thương do nhiệt", "Bỏng hóa chất", "Gãy xương", "Thương tích do điện"], correct: "Gãy xương"},

    // --- BÀI 7: THƯƠNG TÍCH ĐIỆN TRONG PHÁP Y ---
    {cat: "Bài 7: Thương tích điện", q: "Cơ chế gây tử vong phổ biến nhất khi tiếp xúc với dòng điện dân dụng 220V là:", a: ["Rung thất", "Liệt trung tâm hô hấp", "Sốc bỏng điện", "Chấn thương sọ não do ngã"], correct: "Rung thất"},
    {cat: "Bài 7: Thương tích điện", q: "Dòng điện xoay chiều tần số 50-60 Hz nguy hiểm hơn dòng một chiều về mặt điện sinh lý khoảng bao nhiêu lần?", a: ["1-2 lần", "3-4 lần", "5-6 lần", "8-10 lần"], correct: "3-4 lần"},
    {cat: "Bài 7: Thương tích điện", q: "Cường độ dòng điện (tần số 50 Hz) nào có thể gây rung thất và co giật cơ lồng ngực?", a: ["Dưới 0,36 mA", "1-5 mA", "60-90 mA", "200-300 mA"], correct: "60-90 mA"},
    {cat: "Bài 7: Thương tích điện", q: "Theo định luật Joule, nhiệt năng sinh ra trong mô khi có dòng điện đi qua tỉ lệ thuận trực tiếp với yếu tố nào sau đây?", a: ["Hiệu điện thế", "Cường độ dòng điện", "Điện trở mô", "Nhiệt độ môi trường"], correct: "Cường độ dòng điện"},
    {cat: "Bài 7: Thương tích điện", q: "Dòng điện xoay chiều gây nguy hiểm do tạo ra co cơ liên tục với tần số khoảng bao nhiêu lần/giây?", a: ["10-20 lần/giây", "40-110 lần/giây", "150-200 lần/giây", "300-400 lần/giây"], correct: "40-110 lần/giây"},
    {cat: "Bài 7: Thương tích điện", q: "Loại mô nào trong cơ thể có điện trở THẤP NHẤT, dẫn đến dòng điện ưu tiên đi qua?", a: ["Da xơ chai", "Mô mỡ", "Xương", "Dây thần kinh và mạch máu"], correct: "Dây thần kinh và mạch máu"},
    {cat: "Bài 7: Thương tích điện", q: "Điện trở của da bình thường dao động trong khoảng nào?", a: ["100-500 ohm/cm²", "1.000-5.000 ohm/cm²", "30.000-1.000.000 ohm/cm²", "5.000.000-10.000.000 ohm/cm²"], correct: "30.000-1.000.000 ohm/cm²"},
    {cat: "Bài 7: Thương tích điện", q: "Khi da ướt mồ hôi, điện trở da giảm xuống còn khoảng bao nhiêu so với da khô?", a: ["1.200-3.000 ohm/cm²", "5.000-10.000 ohm/cm²", "15.000-20.000 ohm/cm²", "25.000-30.000 ohm/cm²"], correct: "1.200-3.000 ohm/cm²"},
    {cat: "Bài 7: Thương tích điện", q: "Yếu tố nào sau đây làm TĂNG điện trở của da, giúp bảo vệ khỏi điện giật?", a: ["Da ướt mồ hôi", "Vết thương hở trên da", "Da xơ chai (calloused skin)", "Độ ẩm môi trường cao"], correct: "Da xơ chai (calloused skin)"},
    {cat: "Bài 7: Thương tích điện", q: "Khi dòng điện đi qua vùng đầu-mặt và xuyên qua mắt, hậu quả đặc trưng có thể xuất hiện muộn là:", a: ["Xuất huyết kết mạc", "Đục thủy tinh thể (cataract)", "Bong võng mạc", "Tắc động mạch trung tâm võng mạc"], correct: "Đục thủy tinh thể (cataract)"},
    {cat: "Bài 7: Thương tích điện", q: "Theo phân loại điện thế trong pháp y, điện thế cao (high voltage) được định nghĩa là:", a: ["Trên 200 V", "Trên 500 V", "Trên 1000 V", "Trên 5000 V"], correct: "Trên 1000 V"},
    {cat: "Bài 7: Thương tích điện", q: "Nguồn điện nào sau đây hiếm khi gây tử vong ở người không có bệnh lý tim nền?", a: ["220 V dân dụng", "380 V công nghiệp", "24 V nguồn điện thông tin", "110 V dân dụng Mỹ"], correct: "24 V nguồn điện thông tin"},
    {cat: "Bài 7: Thương tích điện", q: "Điện thế tối thiểu để tia lửa điện (hồ quang) có thể đốt cháy quần áo và gây bỏng nhiệt toàn thân là:", a: ["500 V", "1.000 V", "2.500 V", "5.000 V"], correct: "2.500 V"},
    {cat: "Bài 7: Thương tích điện", q: "Đặc điểm điển hình của vết bỏng điện tại điểm vào (entry wound) là:", a: ["Màu đỏ tươi, nền mềm, ranh giới không rõ", "Màu vàng hoặc nâu đen, vùng trung tâm khô cứng, ranh giới rõ", "Màu trắng nhạt, có bọng nước, xung quanh phù nề", "Màu đen hoàn toàn, lan rộng, không ranh giới"], correct: "Màu vàng hoặc nâu đen, vùng trung tâm khô cứng, ranh giới rõ"},
    {cat: "Bài 7: Thương tích điện", q: "Vết bỏng tiếp xúc (kissing burn) trong điện giật cao thế đặc trưng xuất hiện ở vị trí nào trên cơ thể?", a: ["Đầu ngón tay và mu bàn tay", "Lòng bàn tay", "Các nếp gấp da quanh khớp", "Vùng lưng và hông"], correct: "Các nếp gấp da quanh khớp"},
    {cat: "Bài 7: Thương tích điện", q: "Cơ chế chính tạo ra vết bỏng tiếp xúc (kissing burn) tại các nếp gấp da là:", a: ["Tia lửa điện phóng trực tiếp vào nếp gấp", "Co cơ gấp phản xạ áp sát các bề mặt da tại nếp gấp kết hợp độ ẩm tại chỗ", "Tích tụ nhiệt do điện trở cao tại vùng khớp", "Hoại tử mạch máu dưới da"], correct: "Co cơ gấp phản xạ áp sát các bề mặt da tại nếp gấp kết hợp độ ẩm tại chỗ"},
    {cat: "Bài 7: Thương tích điện", q: "Tổn thương bỏng nhiệt toàn thân do tia lửa điện chiếm tỷ lệ bao nhiêu trong tổng số thương tích do dòng điện cao thế?", a: ["1-5%", "10-25%", "30-40%", "Trên 50%"], correct: "10-25%"},
    {cat: "Bài 7: Thương tích điện", q: "Đặc điểm nào sau đây phân biệt bỏng điện với bỏng nhiệt thông thường về mặt lâm sàng?", a: ["Diện tích bỏng rộng hơn nhiều", "Độ sâu tổn thương thường nông hơn", "Tổn thương sâu không tương xứng với diện tích bề mặt", "Luôn có phân biệt rõ điểm vào và điểm ra"], correct: "Tổn thương sâu không tương xứng với diện tích bề mặt"},
    {cat: "Bài 7: Thương tích điện", q: "Biến chứng thận nguy hiểm nào có nguy cơ xảy ra sau khi nạn nhân sống sót qua giai đoạn sốc bỏng điện?", a: ["Viêm cầu thận cấp do phức hợp miễn dịch", "Viêm ống thận cấp do myoglobin từ hoại tử cơ vân", "Hội chứng thận hư", "Sỏi thận do tăng canxi máu"], correct: "Viêm ống thận cấp do myoglobin từ hoại tử cơ vân"},
    {cat: "Bài 7: Thương tích điện", q: "Đục thủy tinh thể (cataract) sau điện giật cao thế vùng đầu-mặt có tỷ lệ gặp khoảng bao nhiêu?", a: ["Dưới 1%", "Khoảng 6%", "Khoảng 15-20%", "Trên 30%"], correct: "Khoảng 6%"},
    {cat: "Bài 7: Thương tích điện", q: "Marker sinh hóa nào gợi ý tổn thương cơ tim trong điện giật cao thế?", a: ["Tăng LDH đơn thuần", "Tăng CPK-MB", "Tăng AST/ALT", "Tăng bilirubin"], correct: "Tăng CPK-MB"},
    {cat: "Bài 7: Thương tích điện", q: "Tổn thương mạch máu đặc trưng trong điện giật cao thế được mô tả là:", a: ["Vỡ thành động mạch lớn cấp tính", "Co thắt hoặc huyết khối trong lớp áo giữa (tunica media) thành mạch", "Phình mạch cấp tính", "Tắc mạch do khí"], correct: "Co thắt hoặc huyết khối trong lớp áo giữa (tunica media) thành mạch"},
    {cat: "Bài 7: Thương tích điện", q: "Gãy xương dài hoặc trật khớp vai trong điện giật xảy ra chủ yếu do cơ chế nào?", a: ["Dòng điện phá hủy trực tiếp cấu trúc xương", "Co giật cơ mạnh bạo lực do dòng điện", "Hoại tử thiếu máu nuôi xương", "Bỏng nhiệt phá hủy đầu xương"], correct: "Co giật cơ mạnh bạo lực do dòng điện"},
    {cat: "Bài 7: Thương tích điện", q: "Liệt hô hấp trong điện giật xảy ra do cơ chế nào sau đây?", a: ["Chỉ do co thắt cơ hoành đơn thuần", "Chỉ do tác động dòng điện lên brain làm liệt trung tâm hô hấp", "Co giật các cơ hô hấp và/hoặc tác động dòng điện lên trung tâm hô hấp", "Phù phổi cấp do suy tim trái"], correct: "Co giật các cơ hô hấp và/hoặc tác động dòng điện lên trung tâm hô hấp"},
    {cat: "Bài 7: Thương tích điện", q: "Đặc điểm da nào là ĐẶC TRƯNG của tổn thương sét đánh, không thấy trong điện giật công nghiệp thông thường?", a: ["Vết bỏng màu vàng nâu tại điểm tiếp xúc", "Hình ảnh tia chớp hoặc cành cây trên da (Lichtenberg figure)", "Hoại tử trung tâm vết bỏng", "Bỏng độ III toàn thân"], correct: "Hình ảnh tia chớp hoặc cành cây trên da (Lichtenberg figure)"},
    {cat: "Bài 7: Thương tích điện", q: "Trong sét đánh, rối loạn nhịp tim nào phổ biến hơn so với điện giật công nghiệp?", a: ["Rung thất (ventricular fibrillation)", "Cuồng nhĩ (atrial flutter)", "Suy tâm thu và loạn nhịp không phải rung thất", "Block nhĩ thất hoàn toàn"], correct: "Suy tâm thu và loạn nhịp không phải rung thất"},
    {cat: "Bài 7: Thương tích điện", q: "Hiện tượng Keraunoparalysis sau sét đánh biểu hiện lâm sàng chủ yếu là:", a: ["Liệt hai chi trên và khó thở kéo dài", "Liệt hai chi dưới và rối loạn cảm giác có xu hướng hồi phục", "Liệt nửa người vĩnh viễn", "Liệt tứ chi dẫn đến tử vong"], correct: "Liệt hai chi dưới và rối loạn cảm giác có xu hướng hồi phục"},
    {cat: "Bài 7: Thương tích điện", q: "Dòng điện trong sét đánh khác điện giật công nghiệp ở điểm đặc trưng nào?", a: ["Điện thế thấp hơn nhưng cường độ cao hơn", "Hàng triệu volt nhưng thời gian tác động cực ngắn (mili-giây)", "Điện thế tương đương nhưng tần số khác", "Chỉ gây tổn thương bề mặt da"], correct: "Hàng triệu volt nhưng thời gian tác động cực ngắn (mili-giây)"},
    {cat: "Bài 7: Thương tích điện", q: "Tổn thương hoại tử cơ tim do sét đánh có đặc điểm tiên lượng nào đặc biệt so với nhồi máu cơ tim thông thường?", a: ["Vĩnh viễn và không hồi phục, cần ghép tim", "Tiến triển nặng dần trong 48-72 giờ đầu", "Thường hồi phục sau vài giờ mà không cần điều trị đặc hiệu", "Luôn dẫn đến suy tim mạn"], correct: "Thường hồi phục sau vài giờ mà không cần điều trị đặc hiệu"},
    {cat: "Bài 7: Thương tích điện", q: "Sóng áp lực (sóng nổ) gây tổn thương cơ học trong sét đánh hình thành do cơ chế nào?", a: ["Dòng điện trực tiếp phá hủy mô", "Giãn nở không khí đột ngột quanh kênh phóng điện", "Nhiệt lượng cao làm vỡ xương", "Từ trường mạnh gây chấn thương"], correct: "Giãn nở không khí đột ngột quanh kênh phóng điện"},
    {cat: "Bài 7: Thương tích điện", q: "Trong giám định pháp y tử vong do điện, yếu tố nào tại hiện trường quan trọng nhất cần xác định?", a: ["Giới tính và tuổi tác nạn nhân", "Nguồn điện, tình trạng dây dẫn và điểm tiếp xúc của nạn nhân với nguồn điện", "Thời điểm tử vong chính xác", "Tư thế tử thi tại chỗ"], correct: "Nguồn điện, tình trạng dây dẫn và điểm tiếp xúc của nạn nhân với nguồn điện"},
    {cat: "Bài 7: Thương tích điện", q: "Trong thực tế giám định pháp y, tử vong do điện thường gặp nhất trong hoàn cảnh nào?", a: ["Án mạng có chủ mưu", "Tự tử", "Tai nạn ngoài ý muốn", "Tử hình bằng ghế điện"], correct: "Tai nạn ngoài ý muốn"},
    {cat: "Bài 7: Thương tích điện", q: "Dấu hiệu tử thi nào tại khám nghiệm giúp định danh tử vong do sét đánh?", a: ["Phù toàn thân và gan to", "Lichtenberg figure trên da và phù phổi", "Hoại tử gan cấp", "Xuất huyết não lan rộng"], correct: "Lichtenberg figure trên da và phù phổi"},
    {cat: "Bài 7: Thương tích điện", q: "Khi khám nghiệm hiện trường nghi ngờ tử vong do sét đánh, bằng chứng vật chứng nào cần ưu tiên tìm kiếm?", a: ["Dây điện đứt hoặc thiết bị điện hỏng", "Cây bị vỡ/cháy, cột điện cháy, vật kim loại bị nóng chảy", "Hóa đơn tiền điện tại nhà", "Thiết bị đo điện gần đó"], correct: "Cây bị vỡ/cháy, cột điện cháy, vật kim loại bị nóng chảy"},
    {cat: "Bài 7: Thương tích điện", q: "Đường đi của dòng điện từ tay phải sang tay trái nguy hiểm nhất vì lý do gì?", a: ["Gây bỏng cả hai tay cùng lúc", "Dòng điện xuyên qua tim theo trục ngang gây rung thất", "Làm liệt cả hai chi trên", "Gây hoại tử cơ diện rộng cả hai chi"], correct: "Dòng điện xuyên qua tim theo trục ngang gây rung thất"},
    {cat: "Bài 7: Thương tích điện", q: "Khi nạn nhân tỳ đè lên vật dẫn điện cao thế, đặc điểm vết bỏng nào có giá trị pháp y cao nhất để xác định nguồn gây điện giật?", a: ["Kích thước vết bỏng", "Màu sắc vết bỏng", "Hình dạng vết bỏng in dấu của vật dẫn điện", "Độ sâu vết bỏng"], correct: "Hình dạng vết bỏng in dấu của vật dẫn điện"},
    {cat: "Bài 7: Thương tích điện", q: "Nạn nhân được phát hiện tử vong cạnh đường dây điện, có vết bỏng nhỏ màu vàng nâu ở lòng bàn tay phải và vết bỏng tương tự ở bàn chân trái. Kết luận pháp y phù hợp nhất là:", a: ["Bỏng nhiệt thông thường", "Sét đánh điển hình", "Điện giật với điểm vào tay phải, điểm ra bàn chân trái", "Tự gây thương tích"], correct: "Điện giật với điểm vào tay phải, điểm ra bàn chân trái"},
    {cat: "Bài 7: Thương tích điện", q: "Trường hợp nào sau đây có nguy cơ TỬ VONG CAO NHẤT khi tiếp xúc cùng nguồn điện 220V?", a: ["Da khô, đứng trên nền gỗ cách điện", "Da ướt mồ hôi, đứng trên nền bê tông ướt", "Mang giày cách điện, tiếp xúc ngắn", "Da xơ chai, tiếp xúc ngắn"], correct: "Da ướt mồ hôi, đứng trên nền bê tông ướt"},
    {cat: "Bài 7: Thương tích điện", q: "Tại sao dòng điện xoay chiều nguy hiểm hơn dòng một chiều ở cùng cường độ trong bối cảnh điện giật?", a: ["Gây nhiệt lượng cao hơn do tần số cao", "Gây co cơ liên tục khiến nạn nhân không tự thoát được và kích thích rung tim ở tần số 50-60 Hz", "Tạo hồ quang điện mạnh hơn", "Xuyên qua da dễ hơn do điện trở thấp hơn"], correct: "Gây co cơ liên tục khiến nạn nhân không tự thoát được và kích thích rung tim ở tần số 50-60 Hz"},
    {cat: "Bài 7: Thương tích điện", q: "Trong điện giật cao thế, tổn thương nội tạng sâu có thể xảy ra dù bề mặt da ít bị ảnh hưởng. Giải thích cơ chế phù hợp nhất là:", a: ["Nhiệt lượng tập trung ở mô sâu vì điện trở thấp", "Dòng điện tập trung đi qua mô dẫn điện tốt (dây thần kinh, mạch máu) và gây tổn thương dọc đường đi", "Da có khả năng cách điện tốt nên bảo vệ được bề mặt", "Sóng áp lực từ hồ quang điện lan vào mô sâu"], correct: "Dòng điện tập trung đi qua mô dẫn điện tốt (dây thần kinh, mạch máu) và gây tổn thương dọc đường đi"}
];
// Biến điều khiển
let currentQs = [], wrongQs = [], currentIndex = 0, score = 0, selectedCat = "", isTrans = false, timer = null;

// Khởi tạo menu
function init() {
    const cats = [...new Set(masterData.map(item => item.cat))];
    const container = document.getElementById('category-list');
    container.innerHTML = cats.map(c => `
        <button class="btn btn-outline" onclick="startQuiz('${c}')">
            ${c} <br><small>(${masterData.filter(i => i.cat === c).length} câu)</small>
        </button>`).join('');
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    event.target.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Chế độ Sáng' : '🌙 Chế độ Bảo vệ mắt';
}

function startRandomExam() {
    selectedCat = "Ngẫu nhiên XXX câu";
    const TARGET = 60;
    const cats = [...new Set(masterData.map(i => i.cat))];
    currentQs = [];
    let base = Math.floor(TARGET / cats.length), rem = TARGET % cats.length;
    cats.forEach((c, i) => {
        let q = shuffle(masterData.filter(item => item.cat === c));
        currentQs = currentQs.concat(q.slice(0, base + (i < rem ? 1 : 0)));
    });
    shuffle(currentQs);
    renderQuiz();
}

function startQuiz(cat) {
    selectedCat = cat;
    currentQs = cat === 'All' ? shuffle([...masterData]) : shuffle(masterData.filter(i => i.cat === cat));
    renderQuiz();
}

function renderQuiz() {
    currentIndex = 0; score = 0; wrongQs = [];
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('p-bar').style.display = 'block';
    loadQ();
}

function loadQ() {
    isTrans = false;
    const q = currentQs[currentIndex];
    const btnRedo = document.getElementById('btn-redo');
    btnRedo.classList.toggle('hidden', wrongQs.length === 0);
    btnRedo.style.opacity = "1";

    document.getElementById('q-info').innerText = `Câu ${currentIndex + 1}/${currentQs.length} - ${q.cat}`;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('progress').style.width = `${(currentIndex / currentQs.length) * 100}%`;

    const alpha = "ABCDE";
    let opts = shuffle(q.a.map((t, i) => ({ t, id: i })));

    const updateRef = (txt) => txt.replace(/\b([A-E])\b/g, (m, l) => {
        const oldIdx = alpha.indexOf(l);
        const newIdx = opts.findIndex(o => o.id === oldIdx);
        return newIdx !== -1 ? alpha[newIdx] : m;
    });

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    opts.forEach((o, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.setAttribute('data-orig', o.t);
        let label = (o.t.includes("Cả") || o.t.includes("Tất cả")) ? updateRef(o.t) : o.t;
        div.innerText = `${alpha[i]}. ${label}`;
        div.onclick = () => check(o.t, div, q.correct);
        container.appendChild(div);
    });
}

function check(sel, el, cor) {
    if (isTrans) return;
    isTrans = true;
    document.getElementById('btn-redo').style.opacity = "0.5";
    const all = document.querySelectorAll('.option');
    all.forEach(o => o.classList.add('disabled'));

    if (sel === cor) {
        el.classList.add('correct');
        score++;
    } else {
        el.classList.add('wrong');
        wrongQs.push(currentQs[currentIndex]);
        all.forEach(o => { if(o.getAttribute('data-orig') === cor) o.classList.add('correct'); });
    }

    timer = setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQs.length) loadQ();
        else showRes();
    }, 1200);
}

function redoWrongNow() {
    if (isTrans || wrongQs.length === 0) return;
    let remain = currentQs.slice(currentIndex);
    currentQs = shuffle([...wrongQs, ...remain]);
    currentIndex = 0; wrongQs = [];
    loadQ();
}

function showRes() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('score-text').innerText = `${score} / ${currentQs.length}`;
}

function toMenu() {
    clearTimeout(timer);
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

init();
</script>
